[pytest]
testpaths = tests
# importlib mode: the pack root now has an __init__.py (ComfyUI's loader needs it),
# and the default "prepend" mode would try to import a bare `__init__` module for the
# tests directory, executing the pack entry point without a package.
addopts = -q --no-header -p no:cacheprovider --import-mode=importlib
asyncio_mode = auto
